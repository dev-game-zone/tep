<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EUDOXIA Prototype - Fixed Solvability</title>
<style>
  body { margin:0; background:#202020; font-family:sans-serif; }
  canvas { display:block; margin:0 auto; background:#181818; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const PENT_SIZE = 50;
const SNAP_TOLERANCE = 25; // increased for forgiving placement
const ROTATION_STEPS = 16; // used by solver
let totalScore = 0;
let currentLevel = 0;
let levels = [];

// ----- Define levels -----
levels.push([
    {x:200, y:200, placed:false}, {x:260, y:200, placed:false}, {x:230, y:250, placed:false},
    {x:320, y:200, placed:false}, {x:380, y:200, placed:false}, {x:350, y:250, placed:false},
    {x:260, y:300, placed:false}, {x:320, y:300, placed:false}, {x:290, y:350, placed:false},
    {x:350, y:350, placed:false}
]);

levels.push([
    {x:180, y:180, placed:false},{x:240, y:180, placed:false},{x:300, y:180, placed:false},
    {x:210, y:230, placed:false},{x:270, y:230, placed:false},{x:330, y:230, placed:false},
    {x:240, y:280, placed:false},{x:300, y:280, placed:false},{x:360, y:280, placed:false},
    {x:270, y:330, placed:false},{x:330, y:330, placed:false}
]);

let targetPentagons = [];
let clusterPool = [];
let rackClusters = [];
let usedClusters = [];
let dragTarget = null;

// ----- Draw Pentagon -----
function drawPentagon(x,y,size, fillColor="#4da6ff", faceRotation=0, strokeColor="#000", strokeWidth=1, alpha=1.0){
    const angle = 2*Math.PI/5;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(faceRotation);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        const px = size*Math.cos(angle*i - Math.PI/2);
        const py = size*Math.sin(angle*i - Math.PI/2);
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();
    ctx.lineWidth = strokeWidth;
    ctx.strokeStyle = strokeColor;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    ctx.restore();
}

// ----- Draw target & clusters -----
function drawTarget(){
    for(const p of targetPentagons){
        const color = p.placed ? "#44aa44" : "#333333";
        drawPentagon(p.x, p.y, PENT_SIZE, color);
    }
}

function drawClusters(){
    for(const cl of rackClusters){
        const isDragging = !!cl.dragging;
        for(const idx of cl.cells){
            const base = targetPentagons[cl.cells[0]];
            const cell = targetPentagons[idx];
            const dx = cell.x - base.x;
            const dy = cell.y - base.y;
            const angle = cl.rotation || 0;
            const rx = dx*Math.cos(angle) - dy*Math.sin(angle);
            const ry = dx*Math.sin(angle) + dy*Math.cos(angle);
            const fill = "#ffaa44";
            const alpha = isDragging ? 1.0 : 0.95;
            const stroke = isDragging ? "#ffff66" : "#000000";
            const strokeW = isDragging ? 3 : 1;
            drawPentagon(cl.x + rx, cl.y + ry, PENT_SIZE, fill, 0, stroke, strokeW, alpha);
        }
    }
}

// ----- UI -----
function drawUI(difficulty){
    ctx.fillStyle="#ffffff";
    ctx.font="18px sans-serif";
    ctx.fillText("Score: "+totalScore, 20, 28);
    ctx.fillText("Difficulty: "+difficulty, 20, 54);
    ctx.fillText("Level: "+(currentLevel+1), 20, 80);
}

let showPrompt = true;
setTimeout(()=> showPrompt = false, 10000);
function drawPrompt(){
    if(!showPrompt) return;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(380,18,400,42);
    ctx.fillStyle = "#fff";
    ctx.font = "14px sans-serif";
    ctx.fillText("Tip: drag a cluster and rotate while dragging (mouse wheel or ↑/↓).", 392, 46);
}

// ----- Cluster pool -----
function initClusterPool(){
    clusterPool = [
        {cells:[0], rotation:0}, {cells:[1], rotation:0}, {cells:[2], rotation:0},
        {cells:[3,4], rotation:0}, {cells:[5,6], rotation:0}, {cells:[7,8,9], rotation:0},
        {cells:[0,1,2], rotation:0}
    ];
    rackClusters = [];
    usedClusters = [];
    spawnNewBatch();
}

function spawnNewBatch(){
    if(rackClusters.length > 0) return;
    for(let i=0;i<3 && clusterPool.length>0;i++){
        const idx = Math.floor(Math.random()*clusterPool.length);
        const cl = clusterPool.splice(idx,1)[0];
        cl.x = 540;
        cl.y = 60 + i*150;
        cl.origX = cl.x;
        cl.origY = cl.y;
        cl.rotation = 0;
        cl.dragging = false;
        rackClusters.push(cl);
    }
}

// ----- Drag & rotate -----
canvas.addEventListener("mousedown", e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for(const cl of rackClusters){
        for(const idx of cl.cells){
            const base = targetPentagons[cl.cells[0]];
            const cell = targetPentagons[idx];
            const dx = cell.x - base.x;
            const dy = cell.y - base.y;
            const angle = cl.rotation || 0;
            const rx = dx*Math.cos(angle) - dy*Math.sin(angle);
            const ry = dx*Math.sin(angle) + dy*Math.cos(angle);
            const px = cl.x + rx;
            const py = cl.y + ry;
            if(Math.hypot(mx-px, my-py) < PENT_SIZE + 2){
                dragTarget = cl;
                cl.dragging = true;
                cl.offsetX = mx - cl.x;
                cl.offsetY = my - cl.y;
                return;
            }
        }
    }
});

canvas.addEventListener("mousemove", e=>{
    if(!dragTarget) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    dragTarget.x = mx - dragTarget.offsetX;
    dragTarget.y = my - dragTarget.offsetY;
});

canvas.addEventListener("wheel", e=>{
    if(!dragTarget) return;
    e.preventDefault();
    dragTarget.rotation = (dragTarget.rotation || 0) + (e.deltaY>0 ? 0.12 : -0.12);
});

document.addEventListener("keydown", e=>{
    if(!dragTarget) return;
    if(e.key==="ArrowUp") dragTarget.rotation = (dragTarget.rotation||0) + 0.12;
    if(e.key==="ArrowDown") dragTarget.rotation = (dragTarget.rotation||0) - 0.12;
});

// ----- Placement -----
canvas.addEventListener("mouseup", e=>{
    if(!dragTarget) return;
    const firstIdx = dragTarget.cells[0];
    let clusterFits = true;
    let closestTargets = [];

    for(const idx of dragTarget.cells){
        const cell = targetPentagons[idx];
        const dx0 = cell.x - targetPentagons[firstIdx].x;
        const dy0 = cell.y - targetPentagons[firstIdx].y;
        const angle = dragTarget.rotation || 0;
        const dx = dx0*Math.cos(angle) - dy0*Math.sin(angle);
        const dy = dx0*Math.sin(angle) + dy0*Math.cos(angle);
        const px = dragTarget.x + dx;
        const py = dragTarget.y + dy;

        let nearest = null;
        let minDist = Infinity;
        for(const t of targetPentagons){
            if(t.placed) continue;
            const d = Math.hypot(px-t.x, py-t.y);
            if(d<minDist){ minDist=d; nearest=t; }
        }
        if(minDist>SNAP_TOLERANCE) clusterFits=false;
        closestTargets.push(nearest);
    }

    if(clusterFits){
        let clusterPoints = 0;
        for(let i=0;i<dragTarget.cells.length;i++){
            const t = closestTargets[i];
            if(!t) continue;
            t.placed = true;
            clusterPoints += 10;
        }
        totalScore += clusterPoints;

        const ridx = rackClusters.indexOf(dragTarget);
        if(ridx!==-1) rackClusters.splice(ridx,1);
        usedClusters.push(dragTarget);
        if(rackClusters.length===0 && clusterPool.length>0) spawnNewBatch();

        // ✅ only check solvable after successful placement
        checkSolvable();
    } else {
        dragTarget.x = dragTarget.origX;
        dragTarget.y = dragTarget.origY;
        dragTarget.rotation = 0;
    }

    if(targetPentagons.every(p=>p.placed)){
        if(currentLevel+1>=levels.length){
            setTimeout(()=> alert("Congratulations! All levels completed! Total Score: "+totalScore),10);
        } else {
            currentLevel++;
            setTimeout(()=>{ alert("Level Completed! Next Level"); loadLevel(currentLevel); },10);
        }
    }

    dragTarget.dragging=false;
    dragTarget=null;
});

// ----- Hybrid solver -----
function checkSolvable(){
    const empty = targetPentagons.filter(p=>!p.placed);
    if(empty.length===0) return;

    const allClusters = [...rackClusters,...clusterPool];
    const totalCellsLeft = allClusters.reduce((s,c)=>s+c.cells.length,0);
    if(totalCellsLeft < empty.length+1){ // require at least 1 extra cluster to avoid false alert
        setTimeout(()=> alert("Game Over! Cannot complete the shape."),10);
        return;
    }

    function canFill(empties, clusters){
        if(empties.length===0) return true;
        if(clusters.length===0) return false;
        clusters.sort((a,b)=>b.cells.length - a.cells.length);

        for(let i=0;i<clusters.length;i++){
            const cl = clusters[i];
            const rest = clusters.slice(0,i).concat(clusters.slice(i+1));
            for(const start of empties){
                for(let r=0;r<ROTATION_STEPS;r++){
                    const angle = (2*Math.PI/ROTATION_STEPS)*r;
                    let fits=true;
                    const matched=[];
                    for(let j=0;j<cl.cells.length;j++){
                        const base = targetPentagons[cl.cells[0]];
                        const cell = targetPentagons[cl.cells[j]];
                        const dx0 = cell.x-base.x;
                        const dy0 = cell.y-base.y;
                        const dx = dx0*Math.cos(angle) - dy0*Math.sin(angle);
                        const dy = dx0*Math.sin(angle) + dy0*Math.cos(angle);
                        const px = start.x + dx;
                        const py = start.y + dy;
                        const match = empties.find(e=>Math.hypot(px-e.x,py-e.y)<=SNAP_TOLERANCE);
                        if(!match || matched.includes(match)){ fits=false; break; }
                        matched.push(match);
                    }
                    if(fits){
                        const newEmpties = empties.filter(e=>!matched.includes(e));
                        if(canFill(newEmpties, rest)) return true;
                    }
                }
            }
        }
        return false;
    }

    const solvable = canFill(empty.slice(), allClusters.slice());
    if(!solvable) setTimeout(()=> alert("Game Over! Cannot complete the shape."),10);
}

// ----- Dynamic difficulty -----
function getDifficulty(){
    const empty = targetPentagons.filter(p=>!p.placed);
    if(empty.length===0) return "Completed";
    const anyPlaced = targetPentagons.some(p=>p.placed);
    if(!anyPlaced) return "Easy";
    const remainingClusters = [...rackClusters];
    let scarcitySum=0;
    for(const t of empty){
        let validClusters=0;
        for(const cl of remainingClusters){
            let clusterWorks=false;
            for(let r=0;r<ROTATION_STEPS;r++){
                const angle = (2*Math.PI/ROTATION_STEPS)*r;
                let ok=true;
                for(let i=0;i<cl.cells.length;i++){
                    const base = targetPentagons[cl.cells[0]];
                    const cell = targetPentagons[cl.cells[i]];
                    const dx0 = cell.x-base.x;
                    const dy0 = cell.y-base.y;
                    const dx = dx0*Math.cos(angle) - dy0*Math.sin(angle);
                    const dy = dx0*Math.sin(angle) + dy0*Math.cos(angle);
                    const px = t.x + dx;
                    const py = t.y + dy;
                    if(!empty.some(e=>Math.hypot(px-e.x,py-e.y)<=SNAP_TOLERANCE)){ ok=false; break; }
                }
                if(ok){ clusterWorks=true; break; }
            }
            if(clusterWorks) validClusters++;
        }
        scarcitySum += 1/(validClusters||1);
    }
    const score = scarcitySum/empty.length;
    if(score<0.4) return "Easy";
    if(score<0.6) return "Medium";
    if(score<0.8) return "Hard";
    return "Extreme";
}

// ----- Level load -----
function loadLevel(level){
    targetPentagons = levels[level].map(p=>({x:p.x, y:p.y, placed:false}));
    initClusterPool();
}

// ----- Main loop -----
function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawTarget();
    drawClusters();
    drawUI(getDifficulty());
    drawPrompt();
    requestAnimationFrame(loop);
}

// ----- Start -----
loadLevel(currentLevel);
loop();
</script>
</body>
</html>
