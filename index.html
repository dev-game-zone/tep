<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EUDOXIA Prototype - Visual Fixes + Toast</title>
<style>
  body { margin:0; background:#202020; font-family:sans-serif; }
  canvas { display:block; margin:0 auto; background:#181818; }
  #rightPane {
    position:absolute;
    top:20px;
    right:20px;
    width:180px;
    background:rgba(255,255,255,0.1);
    padding:10px;
    border-radius:8px;
    color:#fff;
    font-family:sans-serif;
  }
  #toast {
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%, -50%);
    background:rgba(50,50,50,0.9);
    color:#fff;
    padding:16px 24px;
    border-radius:12px;
    font-family:sans-serif;
    display:none;
    z-index:1000;
    text-align:center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="rightPane">
  <div id="tilesLeft">Tiles left: 0</div>
  <div id="tilesInView">Visible clusters: 0</div>
</div>
<div id="toast">Game Over! Cannot complete the shape.</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const PENT_SIZE = 50;
const SNAP_TOLERANCE = 20; 
const ROTATION_STEPS = 16;
let totalScore = 0;
let currentLevel = 0;

let levels = [];
levels.push([
    {x:200, y:200, placed:false},{x:260,y:200,placed:false},{x:230,y:250,placed:false},
    {x:320,y:200,placed:false},{x:380,y:200,placed:false},{x:350,y:250,placed:false},
    {x:260,y:300,placed:false},{x:320,y:300,placed:false},{x:290,y:350,placed:false},
    {x:350,y:350,placed:false}
]);

levels.push([
    {x:180,y:180,placed:false},{x:240,y:180,placed:false},{x:300,y:180,placed:false},
    {x:210,y:230,placed:false},{x:270,y:230,placed:false},{x:330,y:230,placed:false},
    {x:240,y:280,placed:false},{x:300,y:280,placed:false},{x:360,y:280,placed:false},
    {x:270,y:330,placed:false},{x:330,y:330,placed:false}
]);

let targetPentagons = [];
let clusterPool = [];
let rackClusters = [];
let usedClusters = [];
let dragTarget = null;

// ----- Draw pentagon -----
function drawPentagon(x,y,size, fill="#4da6ff", rotation=0, stroke="#000", lw=1, alpha=1){
    const angle = 2*Math.PI/5;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        const px = size*Math.cos(angle*i - Math.PI/2);
        const py = size*Math.sin(angle*i - Math.PI/2);
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    ctx.restore();
}

// ----- Draw target and clusters -----
function drawTarget(){
    for(const p of targetPentagons){
        const color = p.placed ? "#44aa44" : "#333333";
        drawPentagon(p.x, p.y, PENT_SIZE, color);
    }
}

function drawClusters(){
    for(const cl of rackClusters){
        const isDragging = !!cl.dragging;
        for(const idx of cl.cells){
            const base = targetPentagons[cl.cells[0]];
            const cell = targetPentagons[idx];
            const dx = cell.x - base.x;
            const dy = cell.y - base.y;
            const angle = cl.rotation || 0;
            const rx = dx*Math.cos(angle) - dy*Math.sin(angle);
            const ry = dx*Math.sin(angle) + dy*Math.cos(angle);
            const fill = "#ffaa44";
            const alpha = isDragging ? 1.0 : 0.95;
            const stroke = isDragging ? "#ffff66" : "#000000";
            const lw = isDragging ? 3 : 1;
            drawPentagon(cl.x + rx, cl.y + ry, PENT_SIZE, fill, 0, stroke, lw, alpha);
        }
    }
}

// ----- UI + rightPane -----
function drawUI(){
    ctx.fillStyle="#fff";
    ctx.font="18px sans-serif";
    ctx.fillText("Score: "+totalScore, 20, 28);
    ctx.fillText("Level: "+(currentLevel+1), 20, 54);

    // Right-hand panel
    document.getElementById("tilesLeft").innerText = "Tiles left: " + targetPentagons.filter(p=>!p.placed).length;
    let tilesInView = rackClusters.reduce((sum, cl)=> sum + cl.cells.length, 0);
    document.getElementById("tilesInView").innerText = "Visible clusters: " + tilesInView;
}

// ----- Toast -----
function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(()=> t.style.display="none", 2000);
}

// ----- Cluster pool & spawn -----
function initClusterPool(){
    clusterPool = [
        {cells:[0], rotation:0},{cells:[1], rotation:0},{cells:[2], rotation:0},
        {cells:[3,4], rotation:0},{cells:[5,6], rotation:0},{cells:[7,8,9], rotation:0},
        {cells:[0,1,2], rotation:0}
    ];
    rackClusters = [];
    usedClusters = [];
    spawnNewBatch();
}

function spawnNewBatch(){
    if(rackClusters.length>0) return;
    for(let i=0;i<3 && clusterPool.length>0;i++){
        const idx = Math.floor(Math.random()*clusterPool.length);
        const cl = clusterPool.splice(idx,1)[0];
        cl.x = 540; cl.y = 60 + i*150;
        cl.origX = cl.x; cl.origY = cl.y; cl.dragging=false; cl.rotation=0;
        rackClusters.push(cl);
    }
}

// ----- Input handling -----
canvas.addEventListener("mousedown", e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for(const cl of rackClusters){
        for(const idx of cl.cells){
            const base = targetPentagons[cl.cells[0]];
            const cell = targetPentagons[idx];
            const dx = cell.x - base.x;
            const dy = cell.y - base.y;
            const angle = cl.rotation || 0;
            const rx = dx*Math.cos(angle) - dy*Math.sin(angle);
            const ry = dx*Math.sin(angle) + dy*Math.cos(angle);
            const px = cl.x + rx;
            const py = cl.y + ry;
            if(Math.hypot(mx-px,my-py)<PENT_SIZE+2){
                dragTarget = cl;
                cl.dragging=true;
                cl.offsetX = mx-cl.x;
                cl.offsetY = my-cl.y;
                return;
            }
        }
    }
});

canvas.addEventListener("mousemove", e=>{
    if(!dragTarget) return;
    const rect = canvas.getBoundingClientRect();
    dragTarget.x = e.clientX - rect.left - dragTarget.offsetX;
    dragTarget.y = e.clientY - rect.top - dragTarget.offsetY;
});

canvas.addEventListener("wheel", e=>{
    if(!dragTarget) return;
    e.preventDefault();
    dragTarget.rotation += e.deltaY>0 ? 0.12 : -0.12;
});

document.addEventListener("keydown", e=>{
    if(!dragTarget) return;
    if(e.key==="ArrowUp") dragTarget.rotation+=0.12;
    if(e.key==="ArrowDown") dragTarget.rotation-=0.12;
});

// ----- Placement & snapping -----
canvas.addEventListener("mouseup", e=>{
    if(!dragTarget) return;
    const firstIdx = dragTarget.cells[0];
    let clusterFits = true;
    let closestTargets = [];

    for(const idx of dragTarget.cells){
        const cell = targetPentagons[idx];
        const dx0 = cell.x - targetPentagons[firstIdx].x;
        const dy0 = cell.y - targetPentagons[firstIdx].y;
        const angle = dragTarget.rotation || 0;
        const dx = dx0*Math.cos(angle) - dy0*Math.sin(angle);
        const dy = dx0*Math.sin(angle) + dy0*Math.cos(angle);
        const px = dragTarget.x + dx;
        const py = dragTarget.y + dy;
        let nearest=null; let minDist=Infinity;
        for(const t of targetPentagons){
            if(t.placed) continue;
            const d = Math.hypot(px-t.x,py-t.y);
            if(d<minDist){ minDist=d; nearest=t; }
        }
        if(!nearest || minDist>SNAP_TOLERANCE) clusterFits=false;
        closestTargets.push(nearest);
    }

    if(clusterFits){
        let clusterPoints=0;
        for(let i=0;i<dragTarget.cells.length;i++){
            const t = closestTargets[i];
            if(!t) continue;
            t.placed=true;
            clusterPoints+=10;
        }
        totalScore+=clusterPoints;
        const ridx = rackClusters.indexOf(dragTarget);
        if(ridx!==-1) rackClusters.splice(ridx,1);
        usedClusters.push(dragTarget);
        if(rackClusters.length===0 && clusterPool.length>0) spawnNewBatch();
    } else {
        dragTarget.x=dragTarget.origX;
        dragTarget.y=dragTarget.origY;
        dragTarget.rotation=0;
    }

    checkSolvable();

    if(targetPentagons.every(p=>p.placed)){
        if(currentLevel+1>=levels.length){
            setTimeout(()=> showToast("Congratulations! All levels completed! Total Score: "+totalScore),10);
        } else {
            currentLevel++;
            setTimeout(()=>{ showToast("Level Completed! Next Level"); loadLevel(currentLevel); },10);
        }
    }

    dragTarget.dragging=false;
    dragTarget=null;
});

// ----- Solver (rack-aware) -----
function checkSolvable(){
    const empty = targetPentagons.filter(p=>!p.placed);
    if(empty.length===0) return;

    const allClusters = [...rackClusters]; // only visible rack
    const tilesInView = allClusters.reduce((s,c)=>s+c.cells.length,0);

    if(empty.length - tilesInView > 0){
        // more tiles left than clusters visible → can't judge yet
        return;
    }

    // naive solver for small grids
    const totalCellsLeft = allClusters.reduce((s,c)=>s+c.cells.length,0);
    if(totalCellsLeft<empty.length){
        showToast("Game Over! Cannot complete the shape.");
    }
}

// ----- Level load -----
function loadLevel(level){
    targetPentagons = levels[level].map(p=>({x:p.x,y:p.y,placed:false}));
    initClusterPool();
    totalScore=0;
}

// ----- Main loop -----
function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawTarget();
    drawClusters();
    drawUI();
    requestAnimationFrame(loop);
}

// ----- Start -----
loadLevel(currentLevel);
loop();

</script>
</body>
</html>
