<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EUDOXIA Prototype - Toast & Rack-aware Solver</title>
<style>
  body { margin:0; background:#202020; font-family:sans-serif; display:flex; }
  canvas { background:#181818; display:block; margin:0; }
  #infoPanel {
    width: 200px;
    color:#fff;
    padding:10px;
    font-family:sans-serif;
    font-size:14px;
  }
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 1000;
  }
</style>
</head>
<body>
<canvas id="game" width="600" height="600"></canvas>
<div id="infoPanel">
  <div id="tilesLeft">Tiles Left: 0</div>
  <div id="clustersVisible">Clusters Visible: 0</div>
</div>
<div id="toast"></div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const toast = document.getElementById("toast");
const tilesLeftEl = document.getElementById("tilesLeft");
const clustersVisibleEl = document.getElementById("clustersVisible");

const PENT_SIZE = 50;
const SNAP_TOLERANCE = 20; 
const ROTATION_STEPS = 16;
let totalScore = 0;
let currentLevel = 0;

let levels = [
  [
    {x:200, y:200, placed:false}, {x:260, y:200, placed:false}, {x:230, y:250, placed:false},
    {x:320, y:200, placed:false}, {x:380, y:200, placed:false}, {x:350, y:250, placed:false},
    {x:260, y:300, placed:false}, {x:320, y:300, placed:false}, {x:290, y:350, placed:false},
    {x:350, y:350, placed:false}
  ],
  [
    {x:180, y:180, placed:false},{x:240, y:180, placed:false},{x:300, y:180, placed:false},
    {x:210, y:230, placed:false},{x:270, y:230, placed:false},{x:330, y:230, placed:false},
    {x:240, y:280, placed:false},{x:300, y:280, placed:false},{x:360, y:280, placed:false},
    {x:270, y:330, placed:false},{x:330, y:330, placed:false}
  ]
];

let targetPentagons = [];
let clusterPool = [];
let rackClusters = [];
let usedClusters = [];
let dragTarget = null;

// ----- Toast helper -----
function showToast(msg, duration=2000){
    toast.textContent = msg;
    toast.style.opacity = 1;
    setTimeout(()=> toast.style.opacity=0, duration);
}

// ----- Draw pentagon -----
function drawPentagon(x,y,size, fill="#4da6ff", rotation=0, stroke="#000", strokeW=1, alpha=1){
    const angle = 2*Math.PI/5;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        const px = size*Math.cos(angle*i - Math.PI/2);
        const py = size*Math.sin(angle*i - Math.PI/2);
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = strokeW;
    ctx.strokeStyle = stroke;
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1.0;
}

// ----- Draw target & clusters -----
function drawTarget(){
    for(const p of targetPentagons){
        const color = p.placed ? "#44aa44" : "#333333";
        drawPentagon(p.x, p.y, PENT_SIZE, color);
    }
}

function drawClusters(){
    for(const cl of rackClusters){
        const isDragging = !!cl.dragging;
        for(const idx of cl.cells){
            const base = targetPentagons[cl.cells[0]];
            const cell = targetPentagons[idx];
            const dx = cell.x - base.x;
            const dy = cell.y - base.y;
            const angle = cl.rotation || 0;
            const rx = dx*Math.cos(angle) - dy*Math.sin(angle);
            const ry = dx*Math.sin(angle) + dy*Math.cos(angle);
            const fill = "#ffaa44";
            const alpha = isDragging ? 1.0 : 0.95;
            const stroke = isDragging ? "#ffff66" : "#000000";
            const strokeW = isDragging ? 3 : 1;
            drawPentagon(cl.x + rx, cl.y + ry, PENT_SIZE, fill, 0, stroke, strokeW, alpha);
        }
    }
}

// ----- Cluster pool -----
function initClusterPool(){
    clusterPool = [
        {cells:[0], rotation:0},{cells:[1], rotation:0},{cells:[2], rotation:0},
        {cells:[3,4], rotation:0},{cells:[5,6], rotation:0},{cells:[7,8,9], rotation:0},
        {cells:[0,1,2], rotation:0}
    ];
    rackClusters = [];
    usedClusters = [];
    spawnNewBatch();
}

function spawnNewBatch(){
    if(rackClusters.length>0) return;
    for(let i=0;i<3 && clusterPool.length>0;i++){
        const idx = Math.floor(Math.random()*clusterPool.length);
        const cl = clusterPool.splice(idx,1)[0];
        cl.x = 540;
        cl.y = 60 + i*150;
        cl.origX = cl.x;
        cl.origY = cl.y;
        cl.rotation=0;
        cl.dragging=false;
        rackClusters.push(cl);
    }
}

// ----- Drag & rotate -----
canvas.addEventListener("mousedown", e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for(const cl of rackClusters){
        for(const idx of cl.cells){
            const base = targetPentagons[cl.cells[0]];
            const cell = targetPentagons[idx];
            const dx = cell.x - base.x;
            const dy = cell.y - base.y;
            const angle = cl.rotation || 0;
            const rx = dx*Math.cos(angle) - dy*Math.sin(angle);
            const ry = dx*Math.sin(angle) + dy*Math.cos(angle);
            const px = cl.x + rx;
            const py = cl.y + ry;
            if(Math.hypot(mx-px,my-py)<PENT_SIZE+2){
                dragTarget=cl;
                cl.dragging=true;
                cl.offsetX=mx-cl.x;
                cl.offsetY=my-cl.y;
                return;
            }
        }
    }
});

canvas.addEventListener("mousemove", e=>{
    if(!dragTarget) return;
    const rect = canvas.getBoundingClientRect();
    dragTarget.x = e.clientX - rect.left - dragTarget.offsetX;
    dragTarget.y = e.clientY - rect.top - dragTarget.offsetY;
});

canvas.addEventListener("wheel", e=>{
    if(!dragTarget) return;
    e.preventDefault();
    dragTarget.rotation = (dragTarget.rotation||0) + (e.deltaY>0?0.12:-0.12);
});

document.addEventListener("keydown", e=>{
    if(!dragTarget) return;
    if(e.key==="ArrowUp") dragTarget.rotation = (dragTarget.rotation||0)+0.12;
    if(e.key==="ArrowDown") dragTarget.rotation = (dragTarget.rotation||0)-0.12;
});

// ----- Placement -----
canvas.addEventListener("mouseup", e=>{
    if(!dragTarget) return;
    const firstIdx = dragTarget.cells[0];
    let clusterFits = true;
    let closestTargets = [];
    for(const idx of dragTarget.cells){
        const cell = targetPentagons[idx];
        const dx0 = cell.x - targetPentagons[firstIdx].x;
        const dy0 = cell.y - targetPentagons[firstIdx].y;
        const angle = dragTarget.rotation || 0;
        const dx = dx0*Math.cos(angle) - dy0*Math.sin(angle);
        const dy = dx0*Math.sin(angle) + dy0*Math.cos(angle);
        const px = dragTarget.x + dx;
        const py = dragTarget.y + dy;

        let nearest = null;
        let minDist = Infinity;
        for(const t of targetPentagons){
            if(t.placed) continue;
            const d = Math.hypot(px - t.x, py - t.y);
            if(d<minDist){ minDist=d; nearest=t; }
        }
        if(!nearest || minDist>SNAP_TOLERANCE) clusterFits=false;
        closestTargets.push(nearest);
    }

    if(clusterFits){
        let clusterPoints = 0;
        for(let i=0;i<dragTarget.cells.length;i++){
            const t = closestTargets[i];
            if(!t) continue;
            t.placed=true;
            clusterPoints+=10;
        }
        totalScore+=clusterPoints;
        const ridx = rackClusters.indexOf(dragTarget);
        if(ridx!==-1) rackClusters.splice(ridx,1);
        usedClusters.push(dragTarget);
        if(rackClusters.length===0 && clusterPool.length>0) spawnNewBatch();
    } else {
        dragTarget.x=dragTarget.origX;
        dragTarget.y=dragTarget.origY;
        dragTarget.rotation=0;
    }

    checkSolvable();
    if(targetPentagons.every(p=>p.placed)){
        if(currentLevel+1>=levels.length){
            setTimeout(()=> showToast("Congratulations! All levels completed! Total Score: "+totalScore),10);
        } else {
            currentLevel++;
            setTimeout(()=>{ showToast("Level Completed! Next Level"); loadLevel(currentLevel); },10);
        }
    }

    dragTarget.dragging=false;
    dragTarget=null;
});

// ----- Combinatorial solver for visible clusters -----
function isPossible(tilesLeft, clusterSizes){
    if(tilesLeft<=0) return true;
    if(clusterSizes.length===0) return false;
    const [first,...rest] = clusterSizes;
    return isPossible(tilesLeft-first, rest) || isPossible(tilesLeft, rest);
}

function checkSolvable(){
    const empty = targetPentagons.filter(p=>!p.placed);
    const tilesLeft = empty.length;
    const clusterSizes = rackClusters.map(c=>c.cells.length);

    tilesLeftEl.textContent = "Tiles Left: " + tilesLeft;
    clustersVisibleEl.textContent = "Clusters Visible: " + rackClusters.length;

    if(tilesLeft>0 && !isPossible(tilesLeft, clusterSizes)){
        showToast("Game Over! Cannot complete with visible clusters.");
    }
}

// ----- Level & init -----
function loadLevel(level){
    targetPentagons = levels[level].map(p=>({x:p.x,y:p.y,placed:false}));
    initClusterPool();
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawTarget();
    drawClusters();
    requestAnimationFrame(loop);
}

loadLevel(currentLevel);
loop();

</script>
</body>
</html>
